<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NAMORA Admin — Catalog &amp; Stock Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>
  <style>
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.25rem;
    }
    .catalog-item-card {
      background: var(--card-admin);
      border: 1px solid var(--line-admin);
      border-radius: var(--radius-md);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
    }
    .catalog-item-card:hover {
      border-color: var(--accent-gold);
    }
    .catalog-thumb-box {
      width: 100%;
      aspect-ratio: 1 / 1.2;
      background: #000;
      position: relative;
      overflow: hidden;
    }
    .catalog-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .stock-badge-active {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: var(--success);
      color: #141210;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }
    .stock-badge-out {
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      background: var(--danger);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
      padding: 0.2rem 0.5rem;
      border-radius: var(--radius-pill);
      text-transform: uppercase;
    }
    .catalog-body {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .catalog-cat {
      font-size: 0.72rem;
      color: var(--accent-gold);
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 0.25rem;
    }
    .catalog-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--ink-admin);
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }
    .catalog-price-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-top: auto;
      padding-top: 0.75rem;
      border-top: 1px solid var(--line-admin);
    }
    .catalog-price {
      font-family: var(--font-luxury);
      font-weight: 800;
      color: var(--accent-gold);
      font-size: 1.1rem;
    }
    .stock-toggle-btn {
      background: var(--bg-admin);
      border: 1px solid var(--line-admin);
      color: var(--ink-admin);
      padding: 0.35rem 0.7rem;
      border-radius: var(--radius-pill);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }
    .stock-toggle-btn:hover {
      border-color: var(--accent-gold);
      color: var(--accent-gold);
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="admin-sidebar">
    <div class="sidebar-brand">
      <a href="index.html" class="sidebar-logo">NAMORA</a>
      <div class="sidebar-sub">Admin Order Hub</div>
    </div>

    <ul class="sidebar-nav">
      <li>
        <a href="index.html">
          <span>📦</span>
          <span>Orders &amp; Shipments</span>
        </a>
      </li>
      <li>
        <a href="products.html" class="active">
          <span>🖼️</span>
          <span>Catalog &amp; Stock</span>
        </a>
      </li>
      <li>
        <a href="settings.html">
          <span>⚙️</span>
          <span>Store Pricing &amp; UPI</span>

    </ul>

    <div class="sidebar-footer">
      <button type="button" class="btn-logout" onclick="logoutAdmin()">
        <span>🚪</span> Sign Out
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="admin-main">
    <header class="admin-header">
      <div class="admin-header-title">Frame Catalog &amp; Inventory</div>
      <div class="admin-header-actions">
        <a href="../#ready-to-ship" target="_blank" class="btn-website-link">
          <span>⚡ View Ready-to-Ship Section</span>
        </a>
      </div>
    </header>

    <div class="admin-content">
      <div class="controls-strip">
        <div class="status-filter-pills">
          <button type="button" class="filter-btn active" onclick="filterCatalog('all', this)">
            All Products (<span id="countCatAll">37</span>)
          </button>
          <button type="button" class="filter-btn" onclick="filterCatalog('cars', this)">
            🏎️ Supercars (<span id="countCatCars">10</span>)

          <button type="button" class="filter-btn" onclick="filterCatalog('pop', this)">

          </button>
        </div>

      <div class="catalog-grid" id="catalogGrid">

  </main>

    let currentCat = 'all';

    async function loadCatalog() {
      // 1. Try Backend API first (includes live DB prices + active overrides)
      try {
        const res = await fetch('/api/products');
        if (res.ok) {
          const json = await res.json();
          if (json.success && Array.isArray(json.products) && json.products.length > 0) {
            catalogItems = json.products.map(p => ({
              id: p.id,
              category: p.category,
              categoryLabel: p.category_label || p.category,
              title: p.title,
              image: p.image_url,
              price: parseFloat(p.price) || 499,
              deposit_price: parseFloat(p.deposit_price) || 49,
              cod_price: parseFloat(p.cod_price) || 450,
              in_stock: p.in_stock !== false,
              stock_quantity: (p.stock_quantity !== undefined ? p.stock_quantity : (p.in_stock !== false ? 5 : 0)),
              is_stock_managed: p.is_stock_managed
            }));
            updateCategoryCounts();
            renderCatalogGrid();
            return;
          }
        }
      } catch (apiErr) {
        console.warn('Backend API /api/products note:', apiErr.message);
      }

      // 2. Fallback to Supabase direct query
      const client = (typeof getSupabase === 'function' ? getSupabase() : null);
      if (client) {
        try {
          const { data, error } = await client
            .from('products')
            .select('*')
            .order('sort_order', { ascending: true });

          if (data && data.length) {
            catalogItems = data.map(p => ({
              id: p.id,
              category: p.category,
              categoryLabel: p.category_label || p.category,
              title: p.title,
              image: p.image_url,
              price: parseFloat(p.price) || 499,
              deposit_price: parseFloat(p.deposit_price) || 49,
              cod_price: parseFloat(p.cod_price) || 450,
              in_stock: p.in_stock !== false,
              stock_quantity: (p.stock_quantity !== undefined ? p.stock_quantity : (p.in_stock !== false ? 5 : 0)),
              is_stock_managed: p.is_stock_managed
            }));
            updateCategoryCounts();
            renderCatalogGrid();
            return;
          }
        } catch (e) {
          console.warn('Supabase catalog fetch note:', e);
        }
      }

      catalogItems = [...DEFAULT_CATALOG];
      updateCategoryCounts();
      renderCatalogGrid();
    }

    function updateCategoryCounts() {
      const setEl = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
      setEl('countAllProducts', catalogItems.length);
      setEl('countCatCars', catalogItems.filter(p => p.category === 'cars').length);
      setEl('countCatSports', catalogItems.filter(p => p.category === 'sports').length);
      setEl('countCatNames', catalogItems.filter(p => p.category === 'names').length);
      setEl('countCatPop', catalogItems.filter(p => p.category === 'pop').length);
    }

    function filterCatalog(cat, btn) {
      currentCat = cat;
      if (btn) {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      }
      renderCatalogGrid();
    }

    function renderCatalogGrid() {
      const grid = document.getElementById('catalogGrid');
      if (!grid) return;

      const filtered = currentCat === 'all'
        ? catalogItems
        : catalogItems.filter(p => p.category === currentCat);

      grid.innerHTML = filtered.map(p => {
        const qty = p.stock_quantity !== undefined ? p.stock_quantity : (p.in_stock ? 5 : 0);
        return `
        <div class="catalog-item-card" id="card-${p.id}">
          <div class="catalog-thumb-box">
            <span class="${p.in_stock && qty > 0 ? 'stock-badge-active' : 'stock-badge-out'}">
              ${p.in_stock && qty > 0 ? `In Stock (${qty})` : 'Out of Stock'}
            </span>
            <img src="../${p.image}" class="catalog-img" alt="${p.title}" onerror="this.src='../design1.jpg'" />
          </div>
          <div class="catalog-body">
            <div class="catalog-cat">${p.categoryLabel}</div>
            <div class="catalog-title">${p.title}</div>
            <div class="catalog-price-row">
              <div style="flex: 1; padding-right: 0.5rem;">
                <div style="display: flex; align-items: center; gap: 0.35rem; margin-bottom: 4px;">
                  <span style="font-size: 0.85rem; font-weight: 700; color: var(--accent-gold);">₹</span>
                  <input type="number" id="price-input-${p.id}" value="${p.price}" min="1" step="1"
                         style="width: 78px; background: var(--bg-admin); border: 1px solid var(--line-admin); color: var(--accent-gold); font-family: var(--font-luxury); font-weight: 800; font-size: 0.95rem; padding: 0.2rem 0.4rem; border-radius: var(--radius-sm); outline: none;" />
                  <button type="button" class="stock-toggle-btn" style="border-color: var(--accent-gold); color: var(--accent-gold); padding: 0.25rem 0.55rem;" onclick="saveProductPrice('${p.id}')" id="btn-save-price-${p.id}">
                    Save
                  </button>
                </div>
                <div style="font-size: 0.72rem; color: var(--ink-muted);">
                  Stock: <strong style="color: ${qty > 0 ? 'var(--success)' : 'var(--danger)'};">${qty} units</strong>
                </div>
              </div>
              <button type="button" class="stock-toggle-btn" onclick="toggleStockStatus('${p.id}')">
                ${p.in_stock && qty > 0 ? 'Mark Out' : 'Mark In'}
              </button>
            </div>
            <div style="display: flex; gap: 0.5rem; margin-top: 0.75rem; border-top: 1px dashed var(--line-admin); padding-top: 0.5rem;">
              <button type="button" class="filter-btn" style="flex: 1; justify-content: center; font-size: 0.72rem; padding: 0.3rem 0.5rem;" onclick="adjustStock('${p.id}', 5)">
                +5 Restock
              </button>
              <button type="button" class="filter-btn" style="flex: 1; justify-content: center; font-size: 0.72rem; padding: 0.3rem 0.5rem;" onclick="adjustStock('${p.id}', -1)" ${qty <= 0 ? 'disabled' : ''}>
                -1 Sold
              </button>
            </div>
          </div>
        </div>
      `;
      }).join('');
    }

    async function saveProductPrice(id) {
      const item = catalogItems.find(p => p.id === id);
      if (!item) return;

      const inputEl = document.getElementById(`price-input-${id}`);
      const btnEl = document.getElementById(`btn-save-price-${id}`);
      if (!inputEl) return;

      const rawVal = inputEl.value.trim();
      const newPrice = parseFloat(rawVal);

      if (isNaN(newPrice) || newPrice <= 0 || !isFinite(newPrice)) {
        alert('Please enter a valid positive price greater than 0.');
        inputEl.value = item.price;
        return;
      }

      if (btnEl) {
        btnEl.disabled = true;
        btnEl.textContent = 'Saving...';
      }

      try {
        // 1. Send update to Backend API
        const res = await fetch('/api/admin/update-product-price', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ product_id: id, price: newPrice })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          item.price = newPrice;
          item.cod_price = newPrice - (item.deposit_price || 49);
          if (data.db_persisted) {
            showToast(`✅ Price for "${item.title}" saved & verified in Supabase: ₹${newPrice}`);
          } else {
            showToast(`⚠️ Price updated on server: ₹${newPrice}. (Run SQL migration in Supabase for permanent DB sync)`);
          }
        } else {
          throw new Error((data && data.error) || 'Failed to update price on server');
        }
      } catch (err) {
        console.warn('API saveProductPrice note, trying Supabase direct update:', err.message);

        // Fallback: Direct Supabase client write
        const client = (typeof getSupabase === 'function' ? getSupabase() : null);
        let fallbackSucceeded = false;

        if (client) {
          try {
            // Try RPC first
            const { data: rpcData, error: rpcErr } = await client.rpc('update_product_price', {
              p_product_id: id,
              p_new_price: newPrice
            });

            if (!rpcErr && rpcData && rpcData.success) {
              fallbackSucceeded = true;
            } else {
              // Try direct table update
              const { data: updateData, error: updateErr } = await client
                .from('products')
                .update({ price: newPrice, cod_price: newPrice - (item.deposit_price || 49), updated_at: new Date().toISOString() })
                .eq('id', id)
                .select();

              if (!updateErr && updateData && updateData.length > 0 && parseFloat(updateData[0].price) === newPrice) {
                fallbackSucceeded = true;
              }
            }

            // Direct verification
            const { data: checkData } = await client.from('products').select('price').eq('id', id).single();
            if (checkData && parseFloat(checkData.price) === newPrice) {
              fallbackSucceeded = true;
            }
          } catch (dbErr) {
            console.error('Supabase direct update error:', dbErr);
          }
        }

        if (fallbackSucceeded) {
          item.price = newPrice;
          showToast(`✅ Price for "${item.title}" saved & verified in Supabase: ₹${newPrice}`);
        } else {
          showToast(`❌ Unable to save price for "${item.title}". Database write failed.`);
          inputEl.value = item.price;
        }
      } finally {
        if (btnEl) {
          btnEl.disabled = false;
          btnEl.textContent = 'Save';
        }
      }
    }

    async function toggleStockStatus(id) {
      const item = catalogItems.find(p => p.id === id);
      if (!item) return;

      const newInStock = !item.in_stock;
      item.in_stock = newInStock;
      if (!newInStock) {
        item.stock_quantity = 0;
      } else if (item.stock_quantity <= 0) {
        item.stock_quantity = 5;
      }
      renderCatalogGrid();

      const client = (typeof getSupabase === 'function' ? getSupabase() : null);
      if (client) {
        try {
          await client
            .from('products')
            .update({ in_stock: newInStock, stock_quantity: item.stock_quantity })
            .eq('id', id);

          if (typeof auditLogAdminAction === 'function') {
            auditLogAdminAction('stock_status_toggled', 'products', id, { in_stock: newInStock, stock_quantity: item.stock_quantity });
          }
        } catch (e) {
          console.warn('Stock status update note:', e);
        }
      }
      showToast(`Updated stock status for "${item.title}"!`);
    }

    async function adjustStock(id, delta) {
      const item = catalogItems.find(p => p.id === id);
      if (!item) return;

      const newQty = Math.max(0, (item.stock_quantity || 0) + delta);
      item.stock_quantity = newQty;
      item.in_stock = (newQty > 0);
      renderCatalogGrid();

      const client = (typeof getSupabase === 'function' ? getSupabase() : null);
      if (client) {
        try {
          // Attempt atomic RPC first
          const { error: rpcErr } = await client.rpc('adjust_product_inventory', {
            p_product_id: id,
            p_change_qty: delta,
            p_movement_type: (delta > 0 ? 'restock' : 'adjustment'),
            p_notes: `Manual adjustment from admin panel (${delta > 0 ? '+' : ''}${delta})`
          });

          if (rpcErr) {
            // Direct update fallback
            await client
              .from('products')
              .update({ stock_quantity: newQty, in_stock: (newQty > 0) })
              .eq('id', id);
          }

          if (typeof auditLogAdminAction === 'function') {
            auditLogAdminAction('stock_adjusted', 'products', id, { delta, new_quantity: newQty });
          }
        } catch (e) {
          console.warn('Stock adjustment note:', e);
        }
      }
      showToast(`Stock updated for "${item.title}": ${newQty} units`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkAdminAuth().then(auth => {
        if (auth) loadCatalog();
      });
    });
  </script>
</body>
</html>
