<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NAMORA — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">

  <!-- SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../supabase-config.js"></script>

  <style>
    body {
      background: radial-gradient(circle at center, #1E1B18 0%, #0E0D0C 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-box {
      background: var(--card-admin);
      border: 1px solid var(--line-admin);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow-admin);
      text-align: center;
      position: relative;
    }
    .login-logo {
      font-family: var(--font-luxury);
      font-size: 1.8rem;
      color: var(--accent-gold);
      font-weight: 700;
      letter-spacing: 0.15em;
      margin-bottom: 0.25rem;
    }
    .login-subtitle {
      font-size: 0.8rem;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2rem;
    }
    .login-form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      text-align: left;
    }
    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--ink-muted);
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .form-input {
      width: 100%;
      background: var(--bg-admin);
      border: 1px solid var(--line-admin);
      color: var(--ink-admin);
      padding: 0.8rem 1rem;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      outline: none;
      transition: var(--transition);
    }
    .form-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 2px var(--accent-gold-glow);
    }
    .btn-login {
      background: var(--accent-gold);
      color: #141210;
      border: none;
      padding: 0.85rem;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
      margin-top: 0.5rem;
    }
    .btn-login:hover {
      background: var(--accent-gold-hover);
      box-shadow: 0 4px 15px rgba(212, 175, 106, 0.35);
    }
    .login-alert {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #FCA5A5;
      padding: 0.65rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
    }
    .demo-login-chip {
      margin-top: 1.5rem;
      display: inline-block;
      font-size: 0.75rem;
      color: var(--accent-gold);
      text-decoration: none;
      background: rgba(212, 175, 106, 0.08);
      padding: 0.4rem 0.8rem;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(212, 175, 106, 0.2);
      cursor: pointer;
    }
    .demo-login-chip:hover {
      background: rgba(212, 175, 106, 0.18);
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="login-logo">NAMORA</div>
    <div class="login-subtitle">Protected Admin Portal</div>

    <div class="login-alert" id="loginAlert"></div>

    <form class="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label for="adminEmail">Admin Email</label>
        <input type="email" id="adminEmail" class="form-input" placeholder="admin@namoraworld.com" required />
      </div>

      <div class="form-group">
        <label for="adminPassword">Password</label>
        <input type="password" id="adminPassword" class="form-input" placeholder="••••••••••••" required />
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        Sign In to Portal &rarr;
      </button>
    </form>

    <div>
      <a href="javascript:void(0)" class="demo-login-chip" onclick="enterDemoMode()">
        ⚡ Quick Preview (Demo Admin Bypass)
      </a>
    </div>

    <div style="margin-top: 1.5rem; font-size: 0.74rem; color: var(--ink-muted);">
      <a href="../" style="color: var(--ink-muted); text-decoration: none;">&larr; Return to Customer Storefront</a>
    </div>
  </div>

  <script>
    function getSupabase() {
      const config = window.NAMORA_SUPABASE_CONFIG || {};
      const url = config.SUPABASE_URL && config.SUPABASE_URL.trim();
      const key = config.SUPABASE_ANON_KEY && config.SUPABASE_ANON_KEY.trim();

      if (window.supabase && typeof window.supabase.createClient === 'function' && url && key && url.startsWith('http')) {
        try {
          return window.supabase.createClient(url, key, {
            auth: { persistSession: true, autoRefreshToken: true }
          });
        } catch (e) {
          console.warn('Supabase Client init error:', e);
        }
      }
      return null;
    }

    async function handleLogin(e) {
      e.preventDefault();
      const alertEl = document.getElementById('loginAlert');
      const btn = document.getElementById('loginBtn');
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      alertEl.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Authenticating...';

      const client = getSupabase();

      if (!client) {
        // If Supabase not yet configured, allow demo bypass
        localStorage.setItem('namora_admin_demo', 'true');
        window.location.href = 'index.html';
        return;
      }

      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: email,
          password: password
        });

        if (error) {
          alertEl.textContent = error.message || 'Invalid email or password';
          alertEl.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'Sign In to Portal →';
        } else {
          localStorage.removeItem('namora_admin_demo');
          window.location.href = 'index.html';
        }
      } catch (err) {
        alertEl.textContent = err.message || 'Network error logging in';
        alertEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In to Portal →';
      }
    }

    function enterDemoMode() {
      localStorage.setItem('namora_admin_demo', 'true');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
